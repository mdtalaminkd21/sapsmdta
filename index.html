<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAPS MDTA Al-Amin</title>

    <link rel="icon" type="image/png" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-512.png">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">

    <style>
        /* Reset tampilan */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Iframe Apps Script */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1; /* Posisi di bawah splash screen */
        }

        /* --- DESAIN SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999; /* Selalu di atas */
            transition: opacity 0.6s ease-out, visibility 0.6s ease-out;
        }

        /* Animasi Logo Berdenyut (Pulse) */
        .splash-logo {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }

        /* Teks Judul Aplikasi */
        .splash-title {
            font-size: 22px;
            font-weight: bold;
            color: #16a085; /* Warna hijau islami/akademik, bisa diubah */
            margin-bottom: 30px;
            text-align: center;
        }

        /* Animasi Loading Spinner berputar */
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #16a085;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* Definisi Keyframes Animasi */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Class untuk menghilangkan splash screen */
        .hidden {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="icon-512.png" alt="Logo MDTA Al-Amin" class="splash-logo">
        <div class="splash-title">SAPS<br>MDTA Al-Amin</div>
        <div class="spinner"></div>
    </div>

    <iframe src="https://script.google.com/macros/s/AKfycbycZ3pknt9KTjeDAQvyzDH0pUrOiszWF2U8RlpVwhK5vzr5bV1w0zRMO_oteDRJG4Ly1Q/exec" allow="camera; microphone; fullscreen" onload="hideSplash()"></iframe>

    <script>
        function hideSplash() {
            // Menambahkan class 'hidden' untuk memicu transisi CSS (memudar)
            document.getElementById('splash-screen').classList.add('hidden');
        }
    </script>
</body>
</html>
